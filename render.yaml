services:
  - type: web
    name: bhashaai-backend
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install --upgrade pip && pip install torch --index-url https://download.pytorch.org/whl/cpu && pip install -r requirements.txt"
    startCommand: "cd backend && python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PROJECT_NAME
        value: BhashaAI
      - key: VERSION
        value: 2.0.0
      - key: SECRET_KEY
        generateValue: true
      - key: BACKEND_CORS_ORIGINS
        value: '["*"]'
      - key: WHISPER_MODEL_NAME
        value: openai/whisper-tiny
      - key: NMT_MODEL_NAME
        value: facebook/nllb-200-distilled-600M
      - key: USE_GPU
        value: "false"
